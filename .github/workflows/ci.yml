name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-build:
    # Pinned rather than ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19 and a release should not ride that change by surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 22+ expands the glob in `npm test`; Node 20 does not, which is
          # why the suite never actually ran in CI.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # v6 is the major that actually defaults to the Node 24 runtime: v5 only
      # had preliminary support and still declares `runs.using: node20`.
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
